services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: hansard-db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=6GB", "-c", "effective_cache_size=16GB", "-c", "work_mem=64MB"]
    environment:
      # Applied only when the data volume is first created; see.env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hansard
    ports:
      # Loopback only: the database must never be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hansard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
